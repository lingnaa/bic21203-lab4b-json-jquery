<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4b - Fetch Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            color: #222;
            margin-bottom: 24px;
        }
        .item {
            margin-bottom: 18px;
            padding: 12px 16px;
            background-color: #f7f9fa;
            border-left: 4px solid #0056b3;
            border-radius: 4px;
        }
        .item h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #444;
        }
        .content {
            font-size: 16px;
            margin: 0;
            font-weight: 500;
        }
        ul {
            margin: 0;
            padding-left: 20px;
        }
        li {
            padding: 2px 0;
        }
        #errorMessage {
            display: none;
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
    <script src="books.js" defer></script>
</head>
<body>
    <h1>Book Collection (Lab 4b)</h1>

    <div id="errorMessage" role="status" aria-live="polite"></div>

    <div class="item">
        <h2>(a) Title of the first book:</h2>
        <p id="firstBookTitle" class="content"></p>
    </div>

    <div class="item">
        <h2>(b) Author of the second book:</h2>
        <p id="secondBookAuthor" class="content"></p>
    </div>

    <div class="item">
        <h2>(c) Genres of both books (grouped by book title):</h2>
        <ul id="genresList" class="content"></ul>
    </div>
</body>
</html>
